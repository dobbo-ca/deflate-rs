name: profile
# Dev tool, not a check: the Rust bench example and the Go oracle under callgrind for each line of
# tests/parity/profile.txt (tests/parity/profile.sh). Runs on dispatch, and on a pull request when
# the label `profile` is added.
on: { workflow_dispatch: {}, pull_request: { types: [labeled] } }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    if: github.event_name != 'pull_request' || github.event.label.name == 'profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: profile
          load: true
          push: false
          tags: deflate-profile:local
          cache-from: type=gha,scope=deflate-rs-profile
          cache-to: type=gha,mode=max,scope=deflate-rs-profile
      - run: docker run --rm deflate-profile:local sh -c 'sh tests/parity/profile.sh $(cat tests/parity/profile.txt)'
